<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Potato Disease Classification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
        }
        .container-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            margin: auto;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-weight: 700;
        }
        .btn-custom {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 25px;
            transition: 0.3s;
            width: 100%;
        }
        .btn-custom:hover {
            background: linear-gradient(to right, #ff4b2b, #ff416c);
        }
        .image-preview {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            border: 5px solid white;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Crop Potato Disease Classification</h1>
        <div class="container-box">
            <h2 class="mb-4">Image Prediction</h2>
            <form action="/" method="post" enctype="multipart/form-data" class="mt-3">
                <label for="fileInput" class="form-label">Choose an image file:</label>
                <input type="file" id="fileInput" name="file" accept=".jpg, .jpeg, .png" class="form-control" required>
                <button type="submit" class="btn btn-custom mt-3">Predict</button>
            </form>
            {% if message %}
            <p class="text-danger mt-3">{{ message }}</p>
            {% endif %}
            {% if image_path %}
            <img src="{{ image_path }}" alt="Uploaded Image" class="image-preview">
            <p class="mt-3"><strong>Actual Label:</strong> {{ actual_label }}</p>
            <p><strong>Predicted Label:</strong> {{ predicted_label }}</p>
            <p><strong>Confidence:</strong> {{ confidence }}%</p>
            {% endif %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
